ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - docs

overrides:
  h3: 2.0.2
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
