name: 问题反馈
description: 报告 @movk/core 的缺陷
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: '@movk/core 版本'
      placeholder: 1.5.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Node.js 或浏览器版本、包管理器、框架版本
      placeholder: Node 24.1.0、pnpm 12.10.1、Vue 3.5
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: 复现链接
      description: 最小可复现的仓库或 StackBlitz 链接
      placeholder: https://github.com/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 复现步骤、期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 报错输出，粘贴前请移除令牌与密钥
      render: text
